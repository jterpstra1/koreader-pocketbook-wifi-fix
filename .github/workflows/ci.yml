name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release this commit as vX.Y.Z (creates the tag). Leave empty to only run the tests."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: scripts/test.sh "$RUNNER_TEMP"

  release:
    # Either push a tag vX.Y.Z, or run this workflow manually with
    # release_tag = vX.Y.Z (the tag is then created on this commit).
    # The version must match PATCH_VERSION and have a CHANGELOG.md section.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a version tag: $TAG" >&2; exit 1 ;;
          esac
      - run: scripts/build-release.sh "$TAG" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            "dist/koreader-pocketbook-wifi-fix-$TAG.zip" \
            dist/2-pocketbook-wifi.lua

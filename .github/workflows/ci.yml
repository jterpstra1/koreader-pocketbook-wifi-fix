name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: scripts/test.sh "$RUNNER_TEMP"

  release:
    # Tag a commit vX.Y.Z (matching PATCH_VERSION, with a CHANGELOG.md section)
    # and push the tag: tests run, then the zip is published as a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "dist/koreader-pocketbook-wifi-fix-$GITHUB_REF_NAME.zip" \
            dist/2-pocketbook-wifi.lua
